<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Resume - Resume Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-file-alt"></i>
                <span>Resume Generator</span>
            </div>
            <ul class="nav-menu">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/dashboard" class="nav-link">Dashboard</a></li>
                <li><a href="/create" class="nav-link">Create Resume</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="form-header">
            <h1>Edit Resume</h1>
            <p>Update your resume information</p>
        </div>

        <form id="editForm" class="resume-form">
            <!-- Personal Information -->
            <section class="form-section">
                <h2><i class="fas fa-user"></i> Personal Information</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location" required>
                    </div>
                </div>
            </section>

            <!-- Professional Summary -->
            <section class="form-section">
                <h2><i class="fas fa-pen-fancy"></i> Professional Summary</h2>
                <div class="form-group full-width">
                    <label for="summary">Summary</label>
                    <textarea id="summary" name="summary" rows="4"></textarea>
                </div>
            </section>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-large">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <a href="/dashboard" class="btn btn-secondary btn-large">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Resume Generator. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const resumeData = {{ resume_data | tojson }};
            
            // Populate form with existing data
            document.getElementById('name').value = resumeData.contact_info.name;
            document.getElementById('email').value = resumeData.contact_info.email;
            document.getElementById('phone').value = resumeData.contact_info.phone;
            document.getElementById('location').value = resumeData.contact_info.location;
            document.getElementById('summary').value = resumeData.summary || '';
            
            // Form submission
            document.getElementById('editForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const data = {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    location: document.getElementById('location').value,
                    summary: document.getElementById('summary').value,
                    experiences: resumeData.experience,
                    education: resumeData.education,
                    skills: resumeData.skills,
                    languages: resumeData.languages,
                    certifications: resumeData.certifications
                };
                
                const filename = '{{ filename }}';
                fetch(`/resume/${filename}/edit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        alert('Resume updated successfully!');
                        window.location.href = `/resume/${filename}`;
                    } else {
                        alert('Error: ' + result.error);
                    }
                })
                .catch(error => alert('Error: ' + error));
            });
        });
    </script>
</body>
</html>
