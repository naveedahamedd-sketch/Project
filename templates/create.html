<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Resume - Resume Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-file-alt"></i>
                <span>Resume Generator</span>
            </div>
            <ul class="nav-menu">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/dashboard" class="nav-link">Dashboard</a></li>
                <li><a href="/create" class="nav-link active">Create Resume</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="form-header">
            <h1>Create a New Resume</h1>
            <p>Fill in your information to create a professional resume</p>
        </div>

        <form id="resumeForm" class="resume-form">
            <!-- Personal Information -->
            <section class="form-section">
                <h2><i class="fas fa-user"></i> Personal Information</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required placeholder="john@example.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone *</label>
                        <input type="tel" id="phone" name="phone" required placeholder="+1-234-567-8900">
                    </div>
                    <div class="form-group">
                        <label for="location">Location *</label>
                        <input type="text" id="location" name="location" required placeholder="City, State">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="website">Website</label>
                        <input type="url" id="website" name="website" placeholder="https://example.com">
                    </div>
                    <div class="form-group">
                        <label for="linkedin">LinkedIn Profile</label>
                        <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/...">
                    </div>
                </div>
                <div class="form-group full-width">
                    <label for="github">GitHub Profile</label>
                    <input type="url" id="github" name="github" placeholder="https://github.com/...">
                </div>
            </section>

            <!-- Professional Summary -->
            <section class="form-section">
                <h2><i class="fas fa-pen-fancy"></i> Professional Summary</h2>
                <div class="form-group full-width">
                    <label for="summary">Summary</label>
                    <textarea id="summary" name="summary" rows="4" placeholder="Write a brief professional summary..."></textarea>
                </div>
            </section>

            <!-- Experience -->
            <section class="form-section">
                <h2><i class="fas fa-briefcase"></i> Work Experience</h2>
                <div id="experienceContainer"></div>
                <button type="button" class="btn btn-secondary" onclick="addExperience()">
                    <i class="fas fa-plus"></i> Add Experience
                </button>
            </section>

            <!-- Education -->
            <section class="form-section">
                <h2><i class="fas fa-graduation-cap"></i> Education</h2>
                <div id="educationContainer"></div>
                <button type="button" class="btn btn-secondary" onclick="addEducation()">
                    <i class="fas fa-plus"></i> Add Education
                </button>
            </section>

            <!-- Skills -->
            <section class="form-section">
                <h2><i class="fas fa-cogs"></i> Skills</h2>
                <div id="skillsContainer"></div>
                <button type="button" class="btn btn-secondary" onclick="addSkill()">
                    <i class="fas fa-plus"></i> Add Skill Category
                </button>
            </section>

            <!-- Languages -->
            <section class="form-section">
                <h2><i class="fas fa-globe"></i> Languages</h2>
                <div id="languagesContainer"></div>
                <button type="button" class="btn btn-secondary" onclick="addLanguage()">
                    <i class="fas fa-plus"></i> Add Language
                </button>
            </section>

            <!-- Certifications -->
            <section class="form-section">
                <h2><i class="fas fa-certificate"></i> Certifications</h2>
                <div id="certificationsContainer"></div>
                <button type="button" class="btn btn-secondary" onclick="addCertification()">
                    <i class="fas fa-plus"></i> Add Certification
                </button>
            </section>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-large">
                    <i class="fas fa-save"></i> Create Resume
                </button>
                <a href="/dashboard" class="btn btn-secondary btn-large">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Resume Generator. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/form.js') }}"></script>
</body>
</html>
